name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      sq_head_uris:
        description: "JSON array of change URIs in the batch under test"
        required: false
      sq_base_uris:
        description: "JSON array of in-flight change URIs this batch speculates on top of"
        required: false
      sq_queue:
        description: "SubmitQueue queue name"
        required: false
      sq_metadata:
        description: "Caller-supplied build metadata, as JSON"
        required: false

# Cancel superseded runs on a PR, but never cancel a merge queue run —
# the queue needs the check to complete to decide merge/eject.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Context
        run: |
          echo "event      : ${{ github.event_name }}"
          echo "ref        : ${{ github.ref }}"
          echo "sha        : ${{ github.sha }}"
          echo "base ref   : ${{ github.base_ref }}"
          echo "head ref   : ${{ github.head_ref }}"
          echo "actor      : ${{ github.actor }}"
          echo "run attempt: ${{ github.run_attempt }}"

      - name: Build
        run: echo "no-op build — nothing to compile yet"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: echo "no-op test — nothing to run yet"

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always()
    steps:
      - name: Report
        run: |
          echo "build: ${{ needs.build.result }}"
          echo "test : ${{ needs.test.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
